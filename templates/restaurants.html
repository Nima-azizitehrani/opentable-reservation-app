{% extends "base.html" %}
{% block content %}
<div class="hero">
  <h1>Restaurants</h1>
  <p class="muted">Search, filter, then click a restaurant to view details and book.</p>
</div>

<div class="card" style="margin-top:14px;">
  <form method="get">
    <div class="grid" style="margin-top:0;">
      <div style="grid-column: span 5;">
        <label>Search</label>
        <input name="q" value="{{ q }}" placeholder="Name or cuisine" />
      </div>
      <div style="grid-column: span 3;">
        <label>City</label>
        <select name="city">
          <option value="">All</option>
          {% for c in cities %}
            <option value="{{ c }}" {% if city==c %}selected{% endif %}>{{ c }}</option>
          {% endfor %}
        </select>
      </div>
      <div style="grid-column: span 3;">
        <label>Cuisine</label>
        <select name="cuisine">
          <option value="">All</option>
          {% for cu in cuisines %}
            <option value="{{ cu }}" {% if cuisine==cu %}selected{% endif %}>{{ cu }}</option>
          {% endfor %}
        </select>
      </div>
      <div style="grid-column: span 1; display:flex; align-items:flex-end;">
        <button class="btn primary" type="submit" style="width:100%;">Go</button>
      </div>
    </div>
  </form>
</div>

<div class="restaurant-grid" style="margin-top:14px;">
  {% for r in rows %}
    <a class="rest-card" href="{{ url_for('restaurant_detail', restaurant_id=r[0]) }}">
      <img src="{{ url_for('static', filename=restaurant_image(r[0])) }}" alt="Restaurant photo">
      <div class="pad">
        <div style="display:flex; justify-content:space-between; gap:10px; align-items:flex-start;">
          <div>
            <div style="font-weight:800; font-size:16px;">{{ r[1] }}</div>
            <div class="muted" style="font-size:13px; margin-top:4px;">{{ r[3] }}</div>
          </div>
          <div class="chip">{{ dollars(r[4]) }}</div>
        </div>
        <div class="chips">
          <span class="chip">{{ r[3] }}</span>
          <span class="chip">Avg {{ r[5] if r[5] else "—" }} ★</span>
        </div>
      </div>
    </a>
  {% endfor %}
</div>
{% endblock %}
